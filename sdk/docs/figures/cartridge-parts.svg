<svg role="img" aria-label="How a cartridge fits together: a .rcart file, built by rcartpack, holds three parts. The .wasm is your code implementing cartlib.Game, the ui toolkit it draws with, and cartlib's wasm plumbing. manifest.json names the game: slug and title, version, description, players and an icon path. assets/ holds sprites, sounds, glyphs, lamp sequences and the icon and logo art. A host, the cabinet engine or the browser player, loads the .rcart and runs HandleInput, Update and Render about thirty times a second, and owns the panel, the LCDs, the lit buttons and the speaker" xmlns="http://www.w3.org/2000/svg" viewBox="0 20 640 468" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" fill="currentColor">
